[project]
name = "user-note"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yashas Samaga", email = "71977329+yashas224@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "black>=26.10.1",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

[project.scripts]
user-note = "user_note:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
